[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sherekhan"
dynamic = ["version"]
description = "ShereKhan — NMR CPMG relaxation-dispersion curve analysis (two-state exchange fitting)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Prof. Dr. Donghan Lee", email = "lee.donghan@gmail.com" },
]
keywords = ["NMR", "CPMG", "relaxation dispersion", "chemical exchange", "biophysics"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.6",
    "matplotlib>=3.3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://www.kbsi.re.kr"

[project.scripts]
sk-prepare = "sk_prepare:main"
sk-run = "sk_run:main"
sk-synth = "sk_createSyntheticDataset:main"

[tool.setuptools]
packages = ["cpmg"]
py-modules = ["sk_run", "sk_prepare", "sk_createSyntheticDataset"]

[tool.setuptools.dynamic]
version = {attr = "cpmg.__version__"}

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
